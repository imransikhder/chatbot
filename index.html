<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Customer Support</h1>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                Hi there! I'm your customer support assistant Imran Sikhder. How can I help you today?
            </div>
            <div class="typing-indicator" id="typingIndicator" style="display: none;">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>
        <div class="quick-replies" id="quickReplies">
            <div class="quick-reply" data-message="What's my order status?">Order Status</div>
            <div class="quick-reply" data-message="What is your return policy?">Return Policy</div>
            <div class="quick-reply" data-message="How do I track my order?">Track Order</div>
            <div class="quick-reply" data-message="How do I contact support?">Contact Support</div>
        </div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Type your question here..." autocomplete="off">
            <button id="sendButton">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
